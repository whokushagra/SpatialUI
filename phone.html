<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Void Phone Preview</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; }
        #phone-root { position: fixed; inset: 0; }
        #phone-camera-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #phone-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #phone-status { position: absolute; top: 10px; left: 10px; right: 10px; font-size: 14px; line-height: 1.4; padding: 6px 10px; background: rgba(15,23,42,0.7); color: #e2e8f0; border-radius: 6px; pointer-events: none; max-width: max-content; }
    </style>
</head>
<body>
    <div id="phone-root">
        <video id="phone-camera-bg" autoplay playsinline muted></video>
        <canvas id="phone-canvas"></canvas>

        <!-- Disconnect button — shown after WebRTC connects, top-left corner -->
        <button id="phone-disconnect-btn" style="display:none;position:absolute;top:12px;left:12px;z-index:9100;align-items:center;gap:6px;padding:7px 14px;background:rgba(15,23,42,0.82);color:#e2e8f0;border:1px solid #334155;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);">
            ← Workspace
        </button>

        <div id="phone-pin-screen" class="phone-screen">
            <h1>Enter the PIN shown on the desktop</h1>
            <div id="phone-pin-display" class="phone-pin-display">- - - -</div>
            <div id="phone-pin-error" class="phone-pin-error"></div>
            <div class="phone-pin-keypad">
                <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
                <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
                <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
                <button data-key="back">⌫</button><button data-key="0">0</button><button data-key="ok" id="phone-pin-ok">OK</button>
            </div>
        </div>

        <div id="phone-status" style="white-space:pre-line;">phone client booting…</div>

        <div id="phone-mode-toggle" class="phone-mode-pill" data-mode="edit">
            <button data-mode="edit" class="active">Edit</button>
            <button data-mode="play">Play</button>
        </div>

        <!-- AR DOM overlay — shown during immersive-ar WebXR session -->
        <div id="ar-overlay">
            <span id="ar-mode-badge" class="ar-mode-badge">AR Mode</span>
            <div id="ar-placement-hint" class="ar-placement-hint">
                <p>Tap a surface to place your design</p>
            </div>
            <div id="ar-controls" class="ar-controls">
                <button id="ar-reset-btn" class="ar-btn">Reset placement</button>
                <button id="ar-exit-btn" class="ar-btn ar-btn-exit">Exit AR</button>
            </div>
        </div>

        <!-- iOS / 3DoF fallback badge -->
        <span id="ios-mode-badge" class="ar-mode-badge ar-mode-badge--3dof" style="display:none;">3DoF Mode</span>
    </div>
    <script type="module" src="/phone.js"></script>
</body>
</html>
